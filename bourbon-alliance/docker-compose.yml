services:
  # ==============================================================================
  # Bourbon Alliance Production Web Application Container
  # ==============================================================================
  bourbon-alliance-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Read from the .env file next to this docker-compose.yml
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: bourbon_alliance_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - APP_URL=https://bourbonalliance.net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - bourbon_network

  # ==============================================================================
  # Optional: Redis Cache & Drop Alert Queue (for national drop traffic spikes)
  # ==============================================================================
  bourbon-redis:
    image: redis:7-alpine
    container_name: bourbon_alliance_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:-bourbon_secure_cache_pass}
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - bourbon_network
    profiles:
      - scale

networks:
  bourbon_network:
    driver: bridge

volumes:
  redis_data:
